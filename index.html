<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ZXing Barcode Scanner</title>
  <script type="module">
    import { BrowserMultiFormatReader } from 'https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.1/esm/index.min.js';

    const codeReader = new BrowserMultiFormatReader();
    const productList = document.getElementById('product-list');
    const scannedItems = new Set();

    function addProduct(code) {
      if (!scannedItems.has(code)) {
        scannedItems.add(code);
        const li = document.createElement('li');
        li.textContent = `Product Code: ${code}`;
        productList.appendChild(li);
      }
    }

    codeReader.listVideoInputDevices()
      .then(videoInputDevices => {
        const selectedDeviceId = videoInputDevices[0].deviceId;

        codeReader.decodeFromVideoDevice(selectedDeviceId, 'video', (result, err) => {
          if (result) {
            addProduct(result.getText());
          }
        });
      })
      .catch(err => console.error(err));
  </script>

  <style>
    body { font-family: sans-serif; padding: 20px; }
    video { width: 400px; height: auto; border: 1px solid #ccc; }
    ul { list-style: none; padding: 0; }
    li { padding: 5px; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>

  <h1>Barcode Scanner (ZXing)</h1>
  <video id="video" autoplay></video>
  <h3>Scanned Products</h3>
  <ul id="product-list"></ul>

</body>
</html>
