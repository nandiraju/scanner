<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Barcode Scanner</title>
  <script src="https://unpkg.com/quagga@0.12.1/dist/quagga.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    #scanner-container { width: 400px; height: 300px; margin-bottom: 20px; border: 1px solid #ccc; }
    ul { list-style: none; padding: 0; }
    li { padding: 5px; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>

  <h1>Barcode Scanner</h1>
  <div id="scanner-container"></div>
  <h3>Scanned Products</h3>
  <ul id="product-list"></ul>

  <script>
    const productList = document.getElementById('product-list');
    const scannedItems = new Set();

    function addProduct(code) {
      if (!scannedItems.has(code)) {
        scannedItems.add(code);
        const li = document.createElement('li');
        li.textContent = `Product Code: ${code}`;
        productList.appendChild(li);
      }
    }

    Quagga.init({
      inputStream: {
        name: "Live",
        type: "LiveStream",
        target: document.getElementById('scanner-container'),
        constraints: {
          facingMode: "environment"
        }
      },
      decoder: {
        readers: ["ean_reader", "code_128_reader", "upc_reader"]
      }
    }, function(err) {
      if (err) {
        console.error(err);
        return;
      }
      Quagga.start();
    });

    Quagga.onDetected(data => {
      const code = data.codeResult.code;
      addProduct(code);
    });
  </script>

</body>
</html>
